services:
  - type: web
    name: relay-1757
    runtime: node
    repo: https://github.com/aa339519589-cpu/1757
    branch: main
    plan: free
    region: oregon
    buildCommand: npm install --global pnpm@10 && pnpm install && pnpm build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ALLOW_LOCALHOST_CONNECTORS
        value: "false"
      - key: ALLOW_PRIVATE_CONNECTORS
        value: "false"
      - key: ALLOW_INSECURE_CONNECTORS
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_PROVIDER_RESPONSE_MB
        value: "50"
      - key: RUN_WORKER_INTERVAL_MS
        value: "700"
