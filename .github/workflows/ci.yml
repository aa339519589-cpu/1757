name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Run verification
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p ci-results
          failed=0
          for check in typecheck lint test build; do
            echo "## $check" | tee -a ci-results/report.md
            pnpm "$check" > "ci-results/$check.log" 2>&1
            status=$?
            echo "exit_code=$status" >> "ci-results/report.md"
            echo '```text' >> "ci-results/report.md"
            tail -n 120 "ci-results/$check.log" >> "ci-results/report.md"
            echo '```' >> "ci-results/report.md"
            echo >> "ci-results/report.md"
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Comment verification report
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file ci-results/report.md

      - name: Fail when verification fails
        if: steps.verify.outputs.failed == '1'
        run: exit 1
